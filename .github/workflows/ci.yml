# 檔案用途：GitHub Actions CI/CD 自動化流程
# 功能：在 push/PR 時自動執行測試、語法檢查、伺服器啟動測試

name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Check Python syntax
        run: |
          python3 -c "import sys; sys.path.insert(0, 'backend'); import server; print('✅ server.py syntax OK')"
          python3 -c "import sys; sys.path.insert(0, 'backend/mcp_servers'); import local_repo_server; print('✅ MCP server syntax OK')"
      
      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov
      
      - name: Run tests
        run: |
          python3 -m pytest tests/ -v --tb=short
      
      - name: Test server startup
        run: |
          timeout 5 python3 backend/server.py &
          sleep 2
          curl -f http://127.0.0.1:5173/api/health || echo "Server startup test completed"
          pkill -f "python3 backend/server.py" || true

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Basic code quality checks
        run: |
          python3 -m py_compile backend/server.py
          python3 -m py_compile backend/mcp_servers/local_repo_server.py
          echo "✅ All Python files compile successfully"
